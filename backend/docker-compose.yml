services:
  db:
    image: mysql:8
    container_name: tfg_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tfg_tickets
      MYSQL_USER: tfg_user
      MYSQL_PASSWORD: ChuckNorris2026
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  php:
    image: php:8.2-cli
    container_name: tfg_php
    working_dir: /var/www
    volumes:
      - ./api:/var/www
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tfg_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  db_data: